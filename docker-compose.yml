services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://selftalk:selftalk@db:5432/selftalk
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_TRUST_HOST: "true"
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: selftalk, POSTGRES_USER: selftalk, POSTGRES_PASSWORD: selftalk }
    volumes: [postgres-data:/var/lib/postgresql/data, private-media:/var/lib/selftalk-media]
volumes: { postgres-data: {}, private-media: {} }
